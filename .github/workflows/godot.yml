name: Godot Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.gd', '**.gdshader', '**.tscn', 'project.godot', 'export_presets.cfg', 'data/**', '.github/workflows/godot.yml']
permissions:
  contents: write
concurrency:
  group: godot-android
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.2.2"
jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Preparar templates de exportacao
        run: |
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mkdir -p ~/.local/share/godot/export_templates
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
      - name: Configurar assinatura de debug e SDK
        run: |
          mkdir -p ~/.config/godot build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JDK="$(dirname $(dirname $(readlink -f $(which java))))"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JDK\""
            echo 'export/android/debug_keystore = "/root/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
          } > ~/.config/godot/editor_settings-4.tres
      - name: Importar recursos
        run: godot --headless --verbose --import || true
      - name: Teste automatico (compila cada script e roda o jogo sem tela)
        continue-on-error: true
        run: |
          mkdir -p report
          : > report/report.txt
          for f in *.gd; do
            echo "== $f" >> report/report.txt
            godot --headless --check-only --script res://$f >> report/report.txt 2>&1 || echo "FALHOU $f" >> report/report.txt
          done
          echo "== execucao do jogo (autoteste, 40 s simulados)" >> report/report.txt
          timeout 150 godot --headless --fixed-fps 60 --quit-after 2400 -- selftest >> report/report.txt 2>&1 || echo "execucao terminou com codigo $?" >> report/report.txt
          tail -c 60000 report/report.txt > report/report_tail.txt
          mv report/report_tail.txt report/report.txt
      - name: Salvar relatorio no repositorio
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "ci"
          git config user.email "ci@example.com"
          git add report/report.txt
          git commit -m "Relatorio de testes [skip ci]" || true
          git push || true
      - name: Exportar APK (lancamento, com reserva em debug)
        run: |
          godot --headless --verbose --export-release "Android" build/neon-carnage-godot.apk || godot --headless --verbose --export-debug "Android" build/neon-carnage-godot.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: neon-carnage-godot-apk
          path: build/neon-carnage-godot.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-${{ github.run_number }}
          name: Neon Carnage Godot (build ${{ github.run_number }})
          files: build/neon-carnage-godot.apk
